trigger:
  - DEV  # Change this to 'main' if you want to trigger on the main branch

pool:
  name: Default  # Ensure you're using the correct self-hosted agent
  demands:
    - Agent.Name -equals AgentSelfHosted  # Ensure the correct agent is selected

steps:
  - checkout: https://github.com/RPAAnubhav/java-ci-cd.git

  # Step 2: Build the artifact using Maven
  - task: Maven@4
    displayName: "Build and package"
    inputs:
      mavenPomFile: "pom.xml"  # Since it's now checked out in the working directory
      goals: "package"
      options: "-DskipTests"
      publishJUnitResults: false

  # Step 3: Publish the artifact to Azure DevOps Artifacts
  - task: PublishBuildArtifacts@1
    displayName: "Publish Artifact to Azure DevOps"
    inputs:
      pathToPublish: "$(Build.ArtifactStagingDirectory)"
      artifactName: "drop"
      publishLocation: "Container"
