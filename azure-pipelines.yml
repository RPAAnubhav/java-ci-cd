trigger:
  - DEV  

pool:
  name: Default  
  demands:
    - Agent.Name -equals AgentSelfHosted  

steps:
  - checkout: self  

  # Build the artifact using Maven
  - task: Maven@4
    displayName: "Build and package"
    inputs:
      mavenPomFile: "pom.xml"
      goals: "package"
      options: "-DskipTests"
      publishJUnitResults: false

  # Copy the artifact to the staging directory
  - task: CopyFiles@2
    displayName: "Copy artifact to staging directory"
    inputs:
      SourceFolder: "$(Build.SourcesDirectory)/target"  # Ensure this path contains the artifact
      Contents: "**/*.war"  # Adjust for JAR if needed
      TargetFolder: "$(Build.ArtifactStagingDirectory)"

  # Publish the artifact to Azure DevOps
  - task: PublishBuildArtifacts@1
    displayName: "Publish Artifact to Azure DevOps"
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop'
      publishLocation: 'Container'
