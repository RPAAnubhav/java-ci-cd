trigger:
  - DEV  # Change this to 'main' if you want to trigger on main branch commits

pool:
  name: Default  # Use the correct agent pool name where your self-hosted agent is running
  demands:
    - Agent.Name -equals AgentSelfHosted  # Ensure the correct agent is selected

steps:
  - checkout: self  # Ensure the repository is checked out

  # Step 1: Build the artifact
  - task: Maven@3
    displayName: "Build and package"
    inputs:
      mavenPomFile: "pom.xml"
      goals: "package"
      options: "-DskipTests"
      publishJUnitResults: false

  # Step 2: Publish the artifact to Azure Artifacts
  - task: PublishBuildArtifacts@1
    displayName: "Publish Artifact to Azure DevOps"
    inputs:
      pathToPublish: "$(Build.ArtifactStagingDirectory)"
      artifactName: "drop"
      publishLocation: "Container"
