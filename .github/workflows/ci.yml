name: CI/CD for Tomcat 

on:
  push:
    branches:
      - DEV
  pull_request:
    branches:
      - DEV

jobs:
  deploy:
    runs-on: self-hosted  
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3  

    - name: Build with Maven
      run: |
        cd $GITHUB_WORKSPACE
        mvn clean install -DskipTests  

    - name: Run Ansible playbook
      run: |
       ansible-playbook -i /ansible-playbook/inventory.ini /ansible-playbook/Tomcatpb.yml  
      
      #env:
        #ANSIBLE_HOST_KEY_CHECKING: "False"  

